<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم الإدارية | صيدليتي - MY Pharmacy</title>

    <!-- Prevent Flash of Incorrect Theme & Language -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('saydalety_admin_theme');
          var isDark = saved === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

          var savedLang = localStorage.getItem('saydalety_admin_lang');
          var lang = savedLang === 'en' ? 'en' : 'ar';
          var dir = lang === 'en' ? 'ltr' : 'rtl';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', dir);
          document.documentElement.setAttribute('data-lang', lang);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts Arabic: Cairo & Almarai -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
