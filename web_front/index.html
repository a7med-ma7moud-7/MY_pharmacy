<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/asset/1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صيدليتي - منصة الرعاية الطبية والصيدلية</title>

    <!-- Prevent Flash of Incorrect Theme or Direction -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('saydalety_theme');
          var isDark = savedTheme === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

          var savedLang = localStorage.getItem('saydalety_lang') === 'en' ? 'en' : 'ar';
          document.documentElement.setAttribute('lang', savedLang);
          document.documentElement.setAttribute('dir', savedLang === 'en' ? 'ltr' : 'rtl');
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts - Cairo & Almarai -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 dark:bg-[#050f0c] text-slate-800 dark:text-slate-100 antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
